[package]
name = "dispel"
version = "0.1.7"
description = "Dispel desktop trading terminal"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dispel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"

# Size-first release build (Tauri's recommended settings): ~14 MB -> ~4 MB binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

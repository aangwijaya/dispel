    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8aa4ff"/><stop offset=".45" stop-color="#2d52d6"/><stop offset="1" stop-color="#02193b" stop-opacity=".2"/></linearGradient>

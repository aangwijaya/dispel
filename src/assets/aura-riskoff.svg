    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9aab"/><stop offset=".28" stop-color="#f0506e"/><stop offset=".7" stop-color="#b3123e"/><stop offset="1" stop-color="#2a0412" stop-opacity=".2"/></linearGradient>
